<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1d1b1a;
        }
        .stage{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 56px;
            padding:56px 32px
        }
        .cube{
            width: 170px;
            height: 170px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform .3s ease, box-shadow .3s ease;
            cursor: pointer;
        }
        .cube::after{
            content: "hover";
            font-size: 28px;
            font-weight: bold;
            color: rgba(255, 255, 255, .9);
            opacity: 0;
            transition: opacity .3s ease;
            text-shadow: 0 2px 6px rgba(0,0,0,.2);
        }
        .cube:hover{
            transform: translateY(-10px);
            box-shadow: 0 0 0 rgba(0,0,0,0);
        }
        .cube:hover::after{
            opacity: 1;
        }
        .c1{
            border-radius: 0%;
            background: linear-gradient(135deg,#ff9a56,#ff5e62);
            box-shadow: 0 10px 24px rgba(255, 94, 98, .35);
        }
        .c2{
            border-radius: 20%;
            background: linear-gradient(135deg,#a8ff78,#23a455);
            box-shadow: 0 10px 24px rgba(35, 164, 85, .35);
        }
        .c3{
            border-radius: 30%;
            background: linear-gradient(135deg,#b8a7d9,#6f5b9e);
            box-shadow: 0 10px 24px rgba(111, 91, 158, .45);
        }
        .c4{
            border-radius: 50%;
            background: linear-gradient(135deg,#ffd36e,#f7a44c);
            box-shadow: 0 10px 24px rgba(247, 164, 76, .4);
        }
        .c5{
            border-radius: 0%;
            background: linear-gradient(135deg,#5b9279,#3d5a66);
            box-shadow: 0 10px 24px rgba(61, 90, 102, .5);
        }
        .c6{
            border-radius: 50%;
            background: linear-gradient(135deg,#c9a9e6,#9a7cc7);
            box-shadow: 0 10px 24px rgba(154, 124, 199, .45);
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="cube c1"></div>
        <div class="cube c2"></div>
        <div class="cube c3"></div>
        <div class="cube c4"></div>
        <div class="cube c5"></div>
        <div class="cube c6"></div>
    </div>
</body>
</html>
